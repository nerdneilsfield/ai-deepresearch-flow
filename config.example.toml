main_model = [
  { model = "openai/gpt-4o-mini", weight = 4 },
  { model = "openai/gpt-4.1-mini", weight = 2 },
  { model = "claude/claude-sonnet-4-5-20250929", weight = 1 },
]

[extract]
# If omitted, the built-in schema is used.
# schema_path = "schemas/paper.json"
output = "paper_infos.json"
errors = "paper_errors.json"
max_concurrency = 6
max_retries = 3
timeout = 60
backoff_base_seconds = 1.0
backoff_max_seconds = 20.0
pause_threshold_seconds = 10.0
truncate_strategy = "head_tail" # head | head_tail
truncate_max_chars = 20000
cost_estimate = true
stage_dag = false

[render]
# If omitted, the built-in markdown template is used.
# template_path = "templates/paper.md.j2"

[translator_config]
# Optional defaults for translator CLI and scheduler knobs.
model = "openai/gpt-4o-mini"
# Optional: same format as model/--model; omit to keep retry on the main model.
# If retry_model uses a different provider from model, also set retry_concurrency;
# otherwise retry requests share the main model semaphore.
# retry_model = "openai/gpt-4.1-mini"
# retry_model = '[{"model":"openai/gpt-4.1-mini","weight":3},{"model":"claude/claude-sonnet-4-5-20250929","weight":1}]'
fallback_model = "claude/claude-sonnet-4-5-20250929"
# fallback_model_2 = "ollama/llama3.1"
document_window = 8
initial_workers = 4
retry_workers = 2
fallback_workers = 2
fallback_2_workers = 2
main_concurrency = 4
# Optional: omit to share main_concurrency with retry requests.
# retry_concurrency = 2
fallback_concurrency = 2
fallback_2_concurrency = 2

# Optional per-base routing windows:
# active_windows = ["22:00-06:00"]
# active_timezone = "Asia/Shanghai"
# See docs/superpowers/specs/2026-04-21-provider-active-window-design.md

[[providers]]
name = "openai"
type = "openai_compatible"
extra_headers = { "X-Title" = "deepresearch-flow" }

base = [
  {
    url = "https://api.openai.com/v1",
    weight = 3,
    key = [
      { value = "env:OPENAI_API_KEY", weight = 4 },
      { value = "env:OPENAI_API_KEY_2", weight = 1, quota_duration = 18000, reset_time = "2026-01-23 18:04:25 +0800 CST", quota_error_tokens = ["exceed", "quota"] },
    ],
  },
  {
    url = "https://openrouter.example.com/v1",
    weight = 1,
    key = [
      { value = "env:OPENROUTER_API_KEY", weight = 1 },
    ],
  },
]

models = [
  { model_name = "gpt-4o-mini", is_stream = true, is_support_json_schema = true, is_support_json_object = true },
  { model_name = "gpt-4.1-mini", is_stream = true, is_support_json_schema = true, is_support_json_object = true },
]

[[providers]]
name = "claude"
type = "claude"
anthropic_version = "2024-02-15"
# max_tokens = 4096

base = [
  {
    url = "https://api.anthropic.com",
    weight = 1,
    key = [
      { value = "env:ANTHROPIC_API_KEY", weight = 1 },
    ],
  },
]

models = [
  { model_name = "claude-sonnet-4-5-20250929", is_stream = true, is_support_json_schema = false, is_support_json_object = false },
]

[[providers]]
name = "ollama"
type = "ollama"

base = [
  {
    url = "http://localhost:11434",
    weight = 1,
    # active_windows = ["22:00-06:00"],
    # active_timezone = "Asia/Shanghai",
    key = [
      { value = "local", weight = 1 },
    ],
  },
]

models = [
  { model_name = "llama3.1", is_stream = true, is_support_json_schema = false, is_support_json_object = true },
]

[embedding]
default_model = "Qwen3-Embedding-4B"
default_provider = "ollama"
dimensions = 1024
normalized = true
batch_size = 32
max_concurrency = 1
# document_window = 8  # Defaults to max_concurrency when omitted.
chunk_max_tokens = 512
chunk_overlap_tokens = 64

[[embedding.providers]]
name = "ollama"
type = "openai_compatible"
base = [
  {
    url = "http://localhost:11434/v1",
    weight = 1,
    # active_windows = ["09:00-12:00", "14:00-18:00"],
    # active_timezone = "Asia/Shanghai",
    key = [{ value = "ollama", weight = 1 }],
  },
]
models = [
  { model_name = "Qwen3-Embedding-4B", dimensions = 1024, max_context = 32768 },
  { model_name = "bge-m3", dimensions = 1024, max_context = 8192 },
]

[[embedding.providers]]
name = "siliconflow"
type = "openai_compatible"
base = [
  { url = "https://api.siliconflow.cn/v1", weight = 1, key = [{ value = "env:SF_KEY", weight = 1 }] },
]
models = [
  { model_name = "Qwen/Qwen3-Embedding-4B", dimensions = 2560, max_context = 32768 },
]

[rerank]
enabled = true
default_model = "BAAI/bge-reranker-v2-m3"
default_provider = "siliconflow"
top_n = 10

[[rerank.providers]]
name = "siliconflow"
type = "openai_compatible"
base = [
  { url = "https://api.siliconflow.cn/v1", weight = 1, key = [{ value = "env:SF_KEY", weight = 1 }] },
]
models = [
  { model_name = "BAAI/bge-reranker-v2-m3", max_context = 8192, max_chunks_per_doc = 1024 },
  { model_name = "Qwen/Qwen3-Reranker-8B", max_context = 32768, instruction = "Rerank by relevance" },
]

[search]
vector_dir = "paper_vectors"
vector_top_k = 50
keyword_top_k = 30
hybrid = true
# access_token = "env:SEARCH_ACCESS_TOKEN"
# Browser auth mode is configured at API startup with SEARCH_AUTH_MODE=static|github-oauth|both.

# BEGIN ADMIN PIPELINE EXAMPLE (optional; disabled by default)
# Optional administrator PDF/BibTeX processing pipeline. Disabled by default.
# The API reads this section from same config passed with PAPER_DB_CONFIG. The
# Worker is materialized only when PAPER_PIPELINE_ENABLED=1 also agrees with
# enabled=true; keep this bridge unset for existing deployments.
# [pipeline]
# enabled = false
# pdfs_per_batch = 20
# max_pdf_bytes = 104857600       # 100 MiB per PDF
# max_batch_bytes = 524288000     # 500 MiB multipart batch
# bibtex_max_bytes = 1048576      # 1 MiB
# max_concurrent_jobs = 2
# retention_days = 7
# work_dir = "/data/pipeline-work/work"       # private uploads/intermediates
# preview_root = "/data/pipeline-work/previews" # private protected previews
# queue_db = "/data/pipeline-work/queue.sqlite3"
# snapshot_db = "/db/papers.db"                # API/Worker must share this file
# static_root = "/static"                       # formal content-addressed output
# webdav_url = "https://dav.example.test/papers" # endpoint only; no credentials
# extract_templates = ["simple"]
# translation_language = "en"
# lease_seconds = 300
# heartbeat_seconds = 30
# validation_retry_limit = 2
# cleanup_batch_size = 100
# formal_gc_batch_size = 100              # bounded immutable formal-object GC
# formal_gc_grace_seconds = 86400         # keep fresh crash leftovers for one day
#
# Selectable uploader model keys. Every default must be in its allowlist.
# [pipeline.models.ocr]
# allowlist = ["paddle/default"]
# default = "paddle/default"
# mapping = { paddle = "PaddleOCR-VL-1.6" }
# [pipeline.models.extract]
# allowlist = ["openai/gpt-4o-mini", "openai/gpt-4.1-mini"]
# default = "openai/gpt-4o-mini"
# [pipeline.models.translate]
# allowlist = ["openai/gpt-4o-mini", "claude/claude-sonnet-4-5-20250929"]
# default = "openai/gpt-4o-mini"
#
# Supporting repair/validation model defaults are server-controlled and are
# included only as nonsecret configuration fingerprints.
# [pipeline.models.supporting]
# repair = "openai/gpt-4o-mini"
# markdown = "openai/gpt-4o-mini"
# validation = "openai/gpt-4o-mini"
# summary = "openai/gpt-4o-mini"
# translation_repair = "openai/gpt-4o-mini"
#
# Credentials never belong in TOML or the queue. For local WebDAV set
# PAPER_PIPELINE_WEBDAV_USERNAME and PAPER_PIPELINE_WEBDAV_PASSWORD through
# the container secret mechanism. The nonsecret fingerprint contains paths and
# endpoint metadata; review it as operational data before publishing.
# END ADMIN PIPELINE EXAMPLE
