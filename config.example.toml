main_model = [
  { model = "openai/gpt-4o-mini", weight = 4 },
  { model = "openai/gpt-4.1-mini", weight = 2 },
  { model = "claude/claude-sonnet-4-5-20250929", weight = 1 },
]

[extract]
# If omitted, the built-in schema is used.
# schema_path = "schemas/paper.json"
output = "paper_infos.json"
errors = "paper_errors.json"
max_concurrency = 6
max_retries = 3
timeout = 60
backoff_base_seconds = 1.0
backoff_max_seconds = 20.0
pause_threshold_seconds = 10.0
truncate_strategy = "head_tail" # head | head_tail
truncate_max_chars = 20000
cost_estimate = true
stage_dag = false

[render]
# If omitted, the built-in markdown template is used.
# template_path = "templates/paper.md.j2"

[[providers]]
name = "openai"
type = "openai_compatible"
extra_headers = { "X-Title" = "deepresearch-flow" }

base = [
  {
    url = "https://api.openai.com/v1",
    weight = 3,
    key = [
      { value = "env:OPENAI_API_KEY", weight = 4 },
      { value = "env:OPENAI_API_KEY_2", weight = 1, quota_duration = 18000, reset_time = "2026-01-23 18:04:25 +0800 CST", quota_error_tokens = ["exceed", "quota"] },
    ],
  },
  {
    url = "https://openrouter.example.com/v1",
    weight = 1,
    key = [
      { value = "env:OPENROUTER_API_KEY", weight = 1 },
    ],
  },
]

models = [
  { model_name = "gpt-4o-mini", is_stream = true, is_support_json_schema = true, is_support_json_object = true },
  { model_name = "gpt-4.1-mini", is_stream = true, is_support_json_schema = true, is_support_json_object = true },
]

[[providers]]
name = "claude"
type = "claude"
anthropic_version = "2024-02-15"
# max_tokens = 4096

base = [
  {
    url = "https://api.anthropic.com",
    weight = 1,
    key = [
      { value = "env:ANTHROPIC_API_KEY", weight = 1 },
    ],
  },
]

models = [
  { model_name = "claude-sonnet-4-5-20250929", is_stream = true, is_support_json_schema = false, is_support_json_object = false },
]

[[providers]]
name = "ollama"
type = "ollama"

base = [
  {
    url = "http://localhost:11434",
    weight = 1,
    key = [
      { value = "local", weight = 1 },
    ],
  },
]

models = [
  { model_name = "llama3.1", is_stream = true, is_support_json_schema = false, is_support_json_object = true },
]
