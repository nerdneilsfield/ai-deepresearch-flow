  - id: provider_bad_quota_not_selected
    when:
      quota_state:
      - exhausted
      - unknown_quota
    expected: not_selected_or_safe_degraded_error
    status: implemented
    priority: 80
    evidence: *id002
  - id: provider_time_edges_fail_closed_or_preserve_active_window_semantics
    evidence:
    - python/deepresearch_flow/paper/tests/test_active_window.py
    - python/deepresearch_flow/paper/tests/test_routing_active_window.py
    - python/deepresearch_flow/paper/tests/test_weighted_routing.py
    when:
      time_state:
