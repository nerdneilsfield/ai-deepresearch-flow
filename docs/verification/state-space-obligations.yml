version: 1
purpose: Independent adversarial state/fault catalog. This file is intentionally not
  generated from the current implementation. It enumerates bounded protocol and environmental
  states that must either be handled, fail closed, degrade safely, or remain visible
  as gaps.
modeling_rules:
- Official protocol states must come from MCP Authorization 2025-06-18 or referenced
  OAuth RFCs.
- Generic storage/network/runtime states come from the repository fault model, not
  from existing code branches.
- Each obligation has an explicit status: implemented, known_gap, or uncovered.
- Implemented obligations must name evidence files; missing evidence fails the local
  gap gate.
- If multiple obligations match a state, the highest priority obligation is the primary
  expected behavior. Equal-priority matches are ambiguous and fail the local gap gate.
- This catalog is local assurance input; it is intentionally not run by CI/CD default
  gates.
sources:
- https://modelcontextprotocol.io/specification/2025-06-18/basic/authorization
- https://www.rfc-editor.org/rfc/rfc9728.html
- https://www.rfc-editor.org/rfc/rfc8707.html
- https://www.rfc-editor.org/rfc/rfc7591.html
subsystems:
- id: oauth_mcp
  dimensions:
    endpoint:
    - register
    - authorize
    - github_callback
    - token
    - protected_resource_metadata
    - mcp_call
    client_state:
    - registered_durable
    - unknown
    - cache_missing
    - cache_corrupt
    - partial_persist
    - duplicate_registration
    - stale_memory_only
    resource_state:
    - canonical
    - metadata_alias
    - missing
    - mismatched
    - malformed
    pkce_state:
    - valid
    - missing
    - verifier_mismatch
    - unsupported_method
    redirect_state:
    - registered
    - mismatch
    - malformed
    storage_fault:
    - none
    - read_error
    - write_error
    - enospc
    - permission_denied
    - fsync_failure
    - rename_failure
    replay_state:
    - fresh
    - code_reuse
    - state_replay
  obligations:
  - id: oauth_storage_faults_fail_closed_without_hot_cache_or_temp_file
    evidence:
    - python/deepresearch_flow/paper/snapshot/tests/test_oauth_client_cache.py
    when:
      storage_fault:
      - write_error
      - enospc
      - permission_denied
      - fsync_failure
      - rename_failure
    expected: fail_closed_no_hot_cache_update_no_temp_file
    status: implemented
    priority: 90
  - id: oauth_read_faults_fail_closed
    when:
      storage_fault: read_error
    expected: fail_closed_or_re_register_without_token_issue
    status: implemented
    priority: 95
    evidence: &id001
    - python/deepresearch_flow/paper/snapshot/tests/test_mcp_transport.py
    - python/deepresearch_flow/paper/snapshot/tests/test_oauth_client_cache.py
    - formal/oauth_client_cache/OAuthClientCache.tla
    - tools/formal/smt/check_all_smt_models.py
  - id: oauth_unknown_or_bad_client_safe_error
    when:
      client_state:
      - unknown
      - cache_missing
      - cache_corrupt
      - partial_persist
      - stale_memory_only
    expected: fail_closed_or_force_new_registration_without_token_issue
    status: implemented
    priority: 80
    evidence: *id001
  - id: oauth_duplicate_registration_atomic_last_write_wins
    evidence:
    - python/deepresearch_flow/paper/snapshot/tests/test_oauth_client_cache.py
    when:
      client_state: duplicate_registration
    expected: atomic_last_write_wins_no_partial_merge
    status: implemented
    priority: 20
  - id: oauth_resource_alias_or_canonical_accepted
    when:
      resource_state:
      - canonical
      - metadata_alias
    expected: normalize_resource_before_authorize_and_token
    status: implemented
    priority: 10
    evidence: *id001
  - id: oauth_bad_resource_fails_closed
    when:
      resource_state:
      - missing
      - mismatched
      - malformed
    expected: fail_closed
    status: implemented
    priority: 75
    evidence: *id001
  - id: oauth_bad_pkce_fails_closed
    when:
      endpoint:
      - authorize
      - token
      pkce_state:
      - missing
      - verifier_mismatch
      - unsupported_method
    expected: fail_closed
    status: implemented
    priority: 74
    evidence: *id001
  - id: oauth_bad_redirect_fails_closed
    when:
      endpoint:
      - authorize
      - github_callback
      - token
      redirect_state:
      - mismatch
      - malformed
    expected: fail_closed
    status: implemented
    priority: 73
    evidence: *id001
  - id: oauth_replay_fails_closed
    when:
      endpoint:
      - github_callback
      - token
      replay_state:
      - code_reuse
      - state_replay
    expected: fail_closed
    status: implemented
    priority: 72
    evidence: *id001
  - id: oauth_metadata_endpoint_does_not_issue_tokens
    when:
      endpoint: protected_resource_metadata
    expected: metadata_only_no_token_issue
    status: implemented
    priority: 100
    evidence: *id001
  - id: oauth_mcp_requires_issued_valid_bearer
    when:
      endpoint: mcp_call
    expected: valid_bearer_required
    status: implemented
    priority: 100
    evidence: *id001
  - id: oauth_happy_path
    when:
      endpoint:
      - register
      - authorize
      - github_callback
      - token
      - mcp_call
      client_state: registered_durable
      resource_state:
      - canonical
      - metadata_alias
      pkce_state: valid
      redirect_state: registered
      storage_fault: none
      replay_state: fresh
    expected: continue_or_issue_bound_token
    status: implemented
    priority: 110
    evidence: *id001
