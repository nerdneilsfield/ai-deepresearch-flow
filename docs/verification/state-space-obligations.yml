    evidence: *id002
  - id: provider_malformed_upstream_does_not_poison_route_pool
    evidence:
    - python/deepresearch_flow/paper/tests/test_weighted_routing.py
    when:
      upstream_fault:
      - malformed_json
      - truncated_stream
    expected: structured_non_quota_error_no_cooldown_without_match
