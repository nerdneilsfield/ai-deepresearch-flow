[project]
name = "deepresearch-flow"
version = "0.10.8"
description = "Workflow tools for paper extraction, review, and research automation."
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [{ name = "DengQi", email = "dengqi935@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.77.0",
    "click>=8.1.7",
    "coloredlogs>=15.0.1",
    "dashscope>=1.25.10",
    "lancedb>=0.20.0",
    "google-auth>=2.48.0",
    "google-genai>=1.60.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "json-repair>=0.55.1",
    "jsonschema>=4.26.0",
    "markdown-it-py>=3.0.0",
    "fastmcp>=3.4.2",
    "mdit-py-plugins>=0.4.0",
    "pyarrow>=18.0.0",
    "pypdf>=6.6.2",
    "pylatexenc>=2.10",
    "pybtex>=0.24.0",
    "rich>=14.3.1",
    "rumdl>=0.1.6",
    "starlette>=0.52.1",
    "tiktoken>=0.9.0",
    "tqdm>=4.67.2",
    "uvicorn>=0.27.1",
]
keywords = ["research", "papers", "pdf", "ocr", "llm", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
urls = { Homepage = "https://github.com/nerdneilsfield/ai-deepresearch-flow", Repository = "https://github.com/nerdneilsfield/ai-deepresearch-flow", Issues = "https://github.com/nerdneilsfield/ai-deepresearch-flow/issues" }

[project.scripts]
deepresearch-flow = "deepresearch_flow.cli:main"

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "python"

[tool.setuptools.package-data]
"deepresearch_flow.paper.schemas" = ["*.json"]
"deepresearch_flow.paper.templates" = ["*.j2"]
"deepresearch_flow.paper.prompt_templates" = ["*.j2"]
"deepresearch_flow.paper.examples" = ["*.toml"]
"deepresearch_flow.paper.web" = ["pdfjs/**/*", "templates/**/*", "static/**/*"]
"deepresearch_flow.recognize" = ["*.js"]

[dependency-groups]
dev = [
    "hypothesis>=6.155.2",
    "pytest>=9.0.2",
    "pytest-cov>=4.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.13.1",
    "ty>=0.0.27",
    "z3-solver>=4.16.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".codex",
    "dist",
    "node_modules",
    "paper_stage_outputs",
    "python/deepresearch_flow/paper/web/pdfjs",
]

[tool.ruff.lint]
select = ["E9", "F811", "F821", "F822", "F823"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F811"]
"python/**/tests/**" = ["F811"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
all = "warn"

[tool.ty.src]
include = ["python/deepresearch_flow"]
exclude = [
    "python/deepresearch_flow/paper/templates",
    "python/deepresearch_flow/paper/prompt_templates",
    "python/deepresearch_flow/paper/web/pdfjs",
]

[[tool.ty.overrides]]
include = ["tests/**", "python/**/tests/**"]

[tool.ty.overrides.rules]
all = "warn"

[tool.ty.terminal]
output-format = "concise"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "python/deepresearch_flow/ocr/tests",
    "python/deepresearch_flow/paper/tests",
    "python/deepresearch_flow/paper/snapshot/tests",
    "python/deepresearch_flow/storage/tests",
    "python/deepresearch_flow/translator/tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v -s"
markers = [
    "fuzz_fast: bounded, deterministic property/fuzz tests suitable for pull-request gates",
    "fuzz_deep: higher-budget property/fuzz tests intended for scheduled or explicit runs",
    "fault: black-box fault-injection and recovery tests",
    "slow: tests that are intentionally outside the fast developer gate",
    "no_network: tests that must not require external network access",
]

[tool.coverage.run]
source = ["deepresearch_flow"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
